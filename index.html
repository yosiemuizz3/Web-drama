<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRACIN HUB — Drama China Short Sub Indo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root {
      --bg: #0f0f0f; --bg-card: #1a1a1a; --red: #e50914; --text: #fff; --muted: #b3b3b3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(0,0,0,.8); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: 900; color: var(--red); text-decoration: none; }
    .search-box { position: relative; }
    .search-input { background: #333; border: none; color: white; padding: 8px 12px 8px 36px; border-radius: 4px; width: 200px; outline: none; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .hero { height: 60vh; background: linear-gradient(90deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.3) 100%), url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=1200') center/cover; display: flex; align-items: center; padding: 0 40px; margin-top: 60px; }
    .hero-content { max-width: 500px; }
    .hero-title { font-size: 42px; font-weight: 800; margin-bottom: 16px; }
    .hero-desc { font-size: 16px; color: #ddd; margin-bottom: 24px; line-height: 1.6; }
    .btn { padding: 12px 24px; border-radius: 4px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: var(--red); color: white; }
    .btn-primary:hover { background: #f40612; }
    .btn-secondary { background: #333; color: white; margin-left: 10px; }
    .section { padding: 30px 20px; max-width: 1400px; margin: 0 auto; }
    .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
    .card { background: var(--bg-card); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform .3s; }
    .card:hover { transform: scale(1.05); }
    .card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #2a2a2a; }
    .card-info { padding: 10px; }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
    .tag { display: inline-block; background: var(--red); font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-left: 6px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.show { display: flex; }
    .modal-content { background: var(--bg-card); border-radius: 12px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.5); border: none; color: white; font-size: 20px; cursor: pointer; z-index: 10; }
    .modal-img { width: 100%; height: 300px; object-fit: cover; }
    .modal-body { padding: 24px; }
    .modal-desc { color: #ccc; line-height: 1.7; margin: 16px 0; }
    .video-container { position: relative; width: 100%; padding-bottom: 56.25%; margin: 20px 0; border-radius: 8px; overflow: hidden; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .hero { padding: 0 20px; height: 50vh; }
      .hero-title { font-size: 28px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
      .search-input { width: 150px; }
    }
  </style>
</head>
<body>

<header>
  <a href="#" class="logo">DRACIN HUB</a>
  <div class="search-box">
    <i class="fas fa-search search-icon"></i>
    <input type="text" class="search-input" id="searchInput" placeholder="Cari drama...">
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title">Drama China Short <span class="tag">GRATIS</span></h1>
    <p class="hero-desc">Koleksi drama China terbaik. Nonton trailer resmi & cari link tonton lengkapnya!</p>
    <a href="#list" class="btn btn-primary"><i class="fas fa-play"></i> Mulai Jelajahi</a>
  </div>
</section>

<section class="section" id="list">
  <h2 class="section-title">🔥 Terbaru & Populer</h2>
  <div id="loadingBox" class="loading">
    <div class="spinner"></div>
    <p>Memuat data drama...</p>
  </div>
  <div class="grid" id="dramaGrid" style="display:none;"></div>
</section>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="tutupModal()"><i class="fas fa-times"></i></button>
    <img class="modal-img" id="mImg" src="" alt="">
    <div class="modal-body">
      <h2 id="mTitle">Judul Drama</h2>
      <p style="color:#888;margin-top:8px"><span id="mYear">2026</span> · ⭐ <span id="mRate">9.3</span></p>
      
      <!-- 🎬 VIDEO TRAILER OTOMATIS DARI TMDB -->
      <div class="video-container" id="trailerBox" style="display:none;">
        <iframe id="trailerVideo" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      
      <p class="modal-desc" id="mDesc">Sinopsis...</p>
      
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;">
        <button class="btn btn-primary" id="tontonBtn" style="flex:1;min-width:150px" onclick="bukaTonton()">
          <i class="fas fa-play"></i> Tonton Trailer
        </button>
        <a class="btn btn-secondary" id="linkTonton" href="#" target="_blank" style="flex:1;min-width:150px;justify-content:center">
          <i class="fas fa-external-link-alt"></i> Tonton Penuh
        </a>
      </div>
    </div>
  </div>
</div>

<script>
// ✅ API KEY KAMU
const TMDB_API_KEY = '1ca241a94357a3ab350f54896e29a6db';
const TMDB_IMG_URL = 'https://image.tmdb.org/t/p/w500';
const TMDB_BASE = 'https://api.themoviedb.org/3';

let allData = [];
let currentDrama = null;

// === AMBIL DATA DRAMA ===
async function ambilDrama() {
  try {
    const res = await fetch(`${TMDB_BASE}/discover/movie?api_key=${TMDB_API_KEY}&with_original_language=zh&sort_by=popularity.desc&page=1&language=id-ID`);
    const data = await res.json();
    allData = data.results || [];
    tampilkanDrama(allData);
  } catch (err) {
    document.getElementById('loadingBox').innerHTML = `<p style="color:red">Gagal memuat: ${err.message}</p>`;
  }
}

function tampilkanDrama(list) {
  document.getElementById('loadingBox').style.display = 'none';
  const grid = document.getElementById('dramaGrid');
  grid.style.display = 'grid';
  grid.innerHTML = list.map(d => `
    <div class="card" onclick="bukaDetail(${d.id})">
      <img class="card-img" src="${d.poster_path ? TMDB_IMG_URL + d.poster_path : 'https://via.placeholder.com/300x450/1a1a1a/fff?text=No+Image'}" alt="${d.title}">
      <div class="card-info">
        <h3 class="card-title">${d.title || d.name || 'Tanpa Judul'}</h3>
        <div class="card-meta">
          <span>⭐ ${d.vote_average?.toFixed(1) || 'N/A'}</span>
          <span>${d.release_date?.substring(0,4) || '—'}</span>
        </div>
      </div>
    </div>
  `).join('');
}

// === BUKA DETAIL + AMBIL TRAILER ===
async function bukaDetail(id) {
  currentDrama = allData.find(d => d.id === id);
  if (!currentDrama) return;

  // Tampilkan info dasar
  document.getElementById('mImg').src = currentDrama.backdrop_path ? TMDB_IMG_URL + currentDrama.backdrop_path : (currentDrama.poster_path ? TMDB_IMG_URL + currentDrama.poster_path : '');
  document.getElementById('mTitle').textContent = currentDrama.title || currentDrama.name;
  document.getElementById('mYear').textContent = currentDrama.release_date?.substring(0,4) || '—';
  document.getElementById('mRate').textContent = currentDrama.vote_average?.toFixed(1) || 'N/A';
  document.getElementById('mDesc').textContent = currentDrama.overview || 'Sinopsis tidak tersedia.';

  // Sembunyikan trailer dulu
  document.getElementById('trailerBox').style.display = 'none';
  document.getElementById('trailerVideo').src = '';

  // Ambil trailer dari TMDB
  try {
    const vidRes = await fetch(`${TMDB_BASE}/movie/${id}/videos?api_key=${TMDB_API_KEY}&language=id-ID`);
    const vidData = await vidRes.json();
    const trailer = vidData.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube');
    
    if (trailer) {
      // Tampilkan trailer otomatis
      document.getElementById('trailerBox').style.display = 'block';
      document.getElementById('trailerVideo').src = `https://www.youtube.com/embed/${trailer.key}?rel=0`;
    }
  } catch (e) {
    console.log('Trailer tidak tersedia');
  }

  // Link tonton penuh — arahkan ke pencarian YouTube
  document.getElementById('linkTonton').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(currentDrama.title + ' drama China sub indo')}`;

  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function bukaTonton() {
  // Buka pencarian YouTube untuk nonton versi lengkap
  if (currentDrama) {
    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(currentDrama.title + ' drama China full episode sub indo')}`, '_blank');
  }
}

function tutupModal() {
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
  // Hentikan video saat tutup
  document.getElementById('trailerVideo').src = '';
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') tutupModal();
});

// === SEARCH ===
document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) return tampilkanDrama(allData);
  const hasil = allData.filter(d => (d.title || '').toLowerCase().includes(q));
  tampilkanDrama(hasil);
});

// === MULAI ===
ambilDrama();
</script>

</body>
</html>
